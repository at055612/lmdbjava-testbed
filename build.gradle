plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    //id("com.github.johnrengelman.shadow") version "8.1.1"
    id("com.gradleup.shadow") version "9.4.1"

}

repositories {
    maven {
        url "https://central.sonatype.com/repository/maven-snapshots"
    }
    //mavenLocal()
    mavenCentral()
}

//if the project has a value for the passed property (i.e from the cmd line via -PpropName=xxx)
//use that, else use a default value
ext.getPropertyOrDefault = { propName, defaultValue ->
    def val
    if (project.hasProperty(propName)
            && project.getProperty(propName) != "unspecified"
            && project.getProperty(propName) != "") {
        val = project.getProperty(propName)
        logger.info("Using property [$propName] with value [$val]")
    } else {
        val = defaultValue
        logger.info("Property [$propName] has no value, using default value [$val]")
    }
    return val
}

def lmdbJavaVersion = "0.8.2"
def version = getPropertyOrDefault('version', 'SNAPSHOT')

dependencies {
    // Use JUnit Jupiter for testing.
//    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'

    implementation (group: 'net.sourceforge.argparse4j', name: 'argparse4j', version: '0.9.0')

    implementation (group: 'org.lmdbjava', name: 'lmdbjava', version: "${lmdbJavaVersion}") {
//    implementation (group: 'org.lmdbjava', name: 'lmdbjava', version: '1.0.0-SNAPSHOT') {
    //implementation (group: 'org.lmdbjava', name: 'lmdbjava', version: '0.9.2') {
        // The native dep can be excluded if we are using our own embedded lib via
        // the prop lmdbjava.embedded.lib
//        exclude group: 'org.lmdbjava', module : 'native'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
//        languageVersion = JavaLanguageVersion.of(12)
    }
}

// Disable the 'jar' task
jar.enabled = false

shadowJar {
    // Set the fat jar name
    archiveBaseName = "lmdbjava-${lmdbJavaVersion}-testbed"
    archiveVersion = "${version}"
}

tasks.withType(JavaCompile) {
    options.release = 25
}

application {
    // Define the main class for the application.
    mainClass = 'lmdbjavatestbed.App'
}

//tasks.named('test') {
//    // Use JUnit Platform for unit tests.
//    useJUnitPlatform()
//}

tasks.jar {
    manifest {
        attributes["Main-Class"] = "lmdbjavatestbed.App"
    }
}

build.dependsOn(shadowJar);
